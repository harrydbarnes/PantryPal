name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_build.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_build.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run both Android emulator versions and release assembly
        type: boolean
        default: true
      preview_apk:
        description: Build a signed Preview APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      firebase: ${{ steps.filter.outputs.firebase }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "firebase=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          paths = Path(os.environ['RUNNER_TEMP'], 'changed-files').read_bytes().split(b'\0')
          paths = [os.fsdecode(p) for p in paths if p]
          shared = lambda p: p.startswith(('.github/scripts/', 'gradle/')) or p in ('.github/workflows/android_build.yml', 'gradlew', 'gradlew.bat', 'gradle.properties') or ('/' not in p and p.endswith('.gradle.kts'))
          android = any(p.startswith('app/') or shared(p) for p in paths)
          firebase = any(p.startswith('firebase/') or p == 'firebase.json' or shared(p) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"android={str(android).lower()}\nfirebase={str(firebase).lower()}\n")
          PYTHON

  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Test and build debug APK
      run: bash .github/scripts/gradle-with-bounded-retry.sh ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --build-cache --configuration-cache --stacktrace

    - name: Build release APK
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
      run: bash .github/scripts/gradle-with-bounded-retry.sh ./gradlew :app:assembleRelease --build-cache --configuration-cache --stacktrace

    - name: Print lint diagnostics
      if: failure()
      run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

    - name: Upload validation reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-validation-reports
        path: |
          app/build/reports/lint-results-debug.*
          app/build/reports/tests/
          app/build/test-results/
        if-no-files-found: ignore

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

    - name: Report APK sizes
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('### APK sizes (not installed size)\n')
            for apk in pathlib.Path('app/build/outputs/apk').rglob('*.apk'):
                summary.write(f'- {apk}: {apk.stat().st_size:,} bytes\n')
        PYTHON

  preview-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PANTRYPAL_RELEASE_KEYSTORE: ${{ github.workspace }}/../pantrypal-preview-signing.jks
      PANTRYPAL_RELEASE_STORE_PASSWORD: ${{ secrets.PANTRYPAL_RELEASE_STORE_PASSWORD }}
      PANTRYPAL_RELEASE_KEY_ALIAS: ${{ secrets.PANTRYPAL_RELEASE_KEY_ALIAS }}
      PANTRYPAL_RELEASE_KEY_PASSWORD: ${{ secrets.PANTRYPAL_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare protected preview signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PANTRYPAL_RELEASE_KEYSTORE_BASE64 }}
        run: bash .github/scripts/prepare-preview-signing.sh
      - name: Build signed side-by-side preview APK
        run: bash .github/scripts/gradle-with-bounded-retry.sh ./gradlew :app:assemblePreview --build-cache --configuration-cache --stacktrace
      - name: Verify preview identity and signing certificate
        run: bash .github/scripts/verify-preview-apk.sh
      - name: Upload PantryPal Preview APK
        uses: actions/upload-artifact@v7
        with:
          name: pantrypal-preview-apk
          path: app/build/distribution/preview/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$PANTRYPAL_RELEASE_KEYSTORE"

  shopping-sync-tests:
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.firebase == 'true'
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)) && '[35,36]' || '[35]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-device-tests.sh
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopping-sync-device-tests-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/review-profile/

  firestore-rules:
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - run: npm test
        working-directory: firebase
