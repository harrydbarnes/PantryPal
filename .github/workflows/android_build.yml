name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_build.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Test and build debug APK
      run: bash .github/scripts/gradle-with-bounded-retry.sh ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --build-cache --configuration-cache --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

    - name: Report APK sizes
      run: |
        python3 - <<'PYTHON'
        import os, pathlib
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('### APK sizes (not installed size)\n')
            for apk in pathlib.Path('app/build/outputs/apk').rglob('*.apk'):
                summary.write(f'- {apk}: {apk.stat().st_size:,} bytes\n')
        PYTHON

  shopping-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.example.pantrypal/files/review-profile app/build/review-profile
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopping-sync-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/review-profile/

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - run: npm install --ignore-scripts
        working-directory: firebase
      - run: npm test
        working-directory: firebase
      - name: Save resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebase-test-lock
          path: firebase/package-lock.json
